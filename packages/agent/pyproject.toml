[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sanvik-agent"
version = "0.1.0"
description = "Local Python runtime for Sanvik AI"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1,<2",
  "langchain-groq>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1,<2",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/sanvik_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]