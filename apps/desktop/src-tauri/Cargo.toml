[package]
name = "sanvik-desktop"
version = "0.1.0"
description = "Sanvik AI desktop shell"
edition = "2021"
build = "build.rs"

[lib]
name = "sanvik_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
